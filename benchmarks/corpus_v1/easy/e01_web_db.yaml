id: e01_web_db
difficulty: easy
tags: [web, database, two-tier]
description: >
  Two-tier web application with admin interface and logging. Public zone with a
  web frontend, a private data zone with a PostgreSQL database, and a management
  zone for the admin panel and log collector.
prompts:
  - id: concise
    text: |
      Create a honeynet with a public web application and a backend PostgreSQL database.
  - id: detailed
    text: |
      Model a simple two-tier corporate application: a web frontend serving HTTP
      traffic and a PostgreSQL database holding application records.
reference:
  required_services:
    - id: web_frontend
      kinds_any: [web]
      deployable_only: true
    - id: postgres_db
      kinds_any: [database]
      archetypes_any: [postgres]
      deployable_only: true
    - id: admin_panel
      kinds_any: [web]
      roles_any: [admin, management]
      deployable_only: true
    - id: log_collector
      kinds_any: [monitor, logging]
      archetypes_any: [fluentd, fluentbit, filebeat]
      deployable_only: true
  required_zones:
    - id: public_zone
      exposure_any: [internet, public]
      internal: false
    - id: data_zone
      exposure_any: [internal, private]
      internal: true
    - id: mgmt_zone
      exposure_any: [internal, private]
      internal: true
  required_dependencies:
    - source_service_id: web_frontend
      target_service_id: postgres_db
    - source_service_id: admin_panel
      target_service_id: postgres_db
  forbidden_placements:
    - service_id: postgres_db
      zone_id: public_zone
    - service_id: admin_panel
      zone_id: public_zone
