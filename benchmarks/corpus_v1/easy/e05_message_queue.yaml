id: e05_message_queue
difficulty: easy
tags: [queue, rabbitmq, producer-consumer]
description: >
  Message queue platform with producer API, RabbitMQ broker, and consumer worker.
  Tests queue archetype and producer-consumer dependency chain.
prompts:
  - id: concise
    text: |
      Create a honeynet with an internal RabbitMQ message broker.
  - id: detailed
    text: |
      Model an event-driven platform: a RabbitMQ broker handling internal
      asynchronous messages between internal services.
reference:
  required_services:
    - id: message_broker
      kinds_any: [queue]
      archetypes_any: [rabbitmq]
      deployable_only: true
    - id: producer_api
      kinds_any: [web, api]
      roles_any: [producer, api]
      deployable_only: true
    - id: consumer_worker
      kinds_any: [worker, compute]
      roles_any: [consumer, worker]
      deployable_only: true
  required_zones:
    - id: internal_zone
      exposure_any: [internal, private]
      internal: true
    - id: app_zone
      exposure_any: [internal, private, dmz]
      internal: false
  supplemental_zones:
    - id: public_zone
      exposure_any: [internet, public]
      internal: false
  required_dependencies:
    - source_service_id: producer_api
      target_service_id: message_broker
    - source_service_id: consumer_worker
      target_service_id: message_broker
  forbidden_placements:
    - service_id: message_broker
      zone_id: app_zone
