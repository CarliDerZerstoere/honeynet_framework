  collected:
    - service_hit_rate
    - zone_hit_rate
    - dependency_hit_rate
    - forbidden_violation_count
    - validation_passed
    - compilation_passed
    - apply_passed
    - total_tokens
    - total_duration_s
    - cold_run
    - world_model_repair_attempts
