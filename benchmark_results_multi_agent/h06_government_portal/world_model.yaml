        timeout: 10s
      image: nginx:1.25-alpine
      ports:
      - 80
      volumes: []
      zone: public_dmz
    kind: web
    name: nginx_load_balancer
    simulate:
      behaviors: []
      hostname: lb.national.gov
      issues: []
      role: Load balancer for public web services
      secrets: []
      services: []
  pgadmin:
    deploy:
      depends_on: []
      env:
      - PGADMIN_DEFAULT_EMAIL=admin@national.gov
      - PGADMIN_DEFAULT_PASSWORD=admin123
      healthcheck:
        interval: 30s
        retries: 3
        start_period: 30s
        test:
        - CMD-SHELL
        - curl -sf http://localhost/ || wget -qO- http://localhost/ || true
        timeout: 10s
      image: dpage/pgadmin4:6.21
      ports:
      - 80
      volumes: []
      zone: data_zone
    kind: unknown
    name: pgadmin
    simulate:
      behaviors: []
      hostname: pgadmin.data.national.gov
      issues: []
      role: Database administration tool
      secrets: []
      services: []
zones:
  application_zone:
    deploy:
      driver: bridge
      internal: true
      network_name: application_zone
    name: application_zone
  compliance_zone:
    deploy:
      driver: bridge
      internal: true
      network_name: compliance_zone
    name: compliance_zone
  data_zone:
    deploy:
      driver: bridge
      internal: true
      network_name: data_zone
    name: data_zone
  document_zone:
    deploy:
      driver: bridge
      internal: true
      network_name: document_zone
    name: document_zone
  identity_zone:
    deploy:
      driver: bridge
      internal: true
      network_name: identity_zone
    name: identity_zone
  ops_zone:
    deploy:
      driver: bridge
      internal: true
      network_name: ops_zone
    name: ops_zone
  public_dmz:
    deploy:
      driver: bridge
      internal: false
      network_name: public_dmz
    name: public_dmz
