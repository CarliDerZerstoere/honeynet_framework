systems:
  audit_trail_service:
    deploy:
      depends_on: []
      env: []
      healthcheck:
        interval: 30s
        retries: 3
        start_period: 30s
        test:
        - CMD-SHELL
        - nc -z localhost 3100 || (echo > /dev/tcp/localhost/3100) 2>/dev/null ||
          true
        timeout: 10s
      image: grafana/loki:2.9.3
      ports:
      - 3100
      volumes: []
      zone: compliance_zone
    kind: storage
    name: audit_trail_service
    simulate:
      behaviors: []
      hostname: audit.compliance.national.gov
      issues: []
      role: Service for audit trails
      secrets: []
      services: []
  case_management_api:
    deploy:
      depends_on: []
      env: []
      healthcheck:
        interval: 30s
        retries: 3
        start_period: 30s
        test:
        - CMD-SHELL
        - curl -sf http://localhost:3000/ || wget -qO- http://localhost:3000/ || true
        timeout: 10s
      image: nginx:1.25-alpine
      ports: []
      volumes: []
      zone: application_zone
    kind: runtime
    name: case_management_api
    simulate:
      behaviors: []
      hostname: api.case.national.gov
      issues: []
      role: REST API for case management
      secrets:
      - api_service_key
      services: []
  citizen_portal:
    deploy:
      depends_on:
      - case_management_api
      env: []
      healthcheck:
        interval: 30s
        retries: 3
        start_period: 30s
        test:
        - CMD-SHELL
        - curl -sf http://localhost/ || wget -qO- http://localhost/ || true
        timeout: 10s
      image: wordpress:6.4-php8.2-apache
      ports:
      - 80
      volumes: []
      zone: public_dmz
    kind: web
    name: citizen_portal
    simulate:
      behaviors: []
      hostname: portal.national.gov
      issues: []
      role: Public-facing citizen portal
      secrets: []
      services: []
  classified_document_store:
    deploy:
      command:
      - minio
      - server
      - /data
      depends_on: []
      env:
      - MINIO_ROOT_USER=admin
      - MINIO_ROOT_PASSWORD=password123
      healthcheck:
        interval: 30s
        retries: 3
        start_period: 30s
        test:
        - CMD-SHELL
        - nc -z localhost 9000 || (echo > /dev/tcp/localhost/9000) 2>/dev/null ||
          true
        timeout: 10s
      image: minio/minio:latest
      ports:
      - 9000
      volumes: []
      zone: data_zone
    kind: storage
    name: classified_document_store
    simulate:
      behaviors: []
      hostname: classified.docs.national.gov
      issues: []
      role: Storage for classified documents
      secrets:
      - classified_store_key
      services: []
  data_retention_compliance_store:
    deploy:
      command:
      - minio
      - server
      - /data
      depends_on: []
      env:
      - MINIO_ROOT_USER=admin
