    deploy:
      depends_on: []
      env: []
      healthcheck:
        interval: 30s
        retries: 3
        start_period: 30s
        test:
        - CMD-SHELL
        - curl -sf http://localhost:80 || wget -qO- http://localhost:80 || true
        timeout: 10s
      image: phpmyadmin:5.2
      ports:
      - 80
      volumes: []
