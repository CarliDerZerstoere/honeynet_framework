        - curl -sf http://localhost:8086/health || wget -qO- http://localhost:8086/health
          || true
        timeout: 10s
      image: influxdb:2.7
      ports:
      - 8086
      volumes: []
      zone: data_zone
    kind: storage
    name: artifact_store
    simulate:
      behaviors: []
      hostname: artifacts.data.internal_developer_platform.internal
      issues: []
      role: Artifact repository for build artifacts
      secrets:
      - artifact_store_access_key
      - artifact_store_secret_key
      services:
      - http
  backup_service:
    deploy:
      command:
      - minio
      - server
      - /data
      depends_on:
      - ci_database
      - artifact_store
      env:
      - MINIO_ACCESS_KEY=admin
      - MINIO_SECRET_KEY=admin123
      healthcheck:
        interval: 30s
        retries: 3
        start_period: 30s
        test:
        - CMD
        - curl
        - -f
        - http://localhost:9000/minio/health/live
        timeout: 10s
      image: minio/minio:latest
      ports:
      - 9000
      volumes: []
      zone: data_zone
