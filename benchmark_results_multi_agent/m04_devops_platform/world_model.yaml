systems:
  admin_ui:
    deploy:
      depends_on:
      - ci_database
      env: []
      healthcheck:
        interval: 30s
        retries: 3
        start_period: 30s
        test:
        - CMD-SHELL
        - curl -sf http://localhost:9000/ || wget -qO- http://localhost:9000/ || true
        timeout: 10s
      image: portainer/portainer-ce:latest
      ports:
      - 9000
      volumes: []
      zone: internal_zone
    kind: web
    name: admin_ui
    simulate:
      behaviors: []
      hostname: admin.internal_developer_platform.internal
      issues: []
      role: Administrative user interface for managing services
      secrets:
      - admin_ui_password
      services:
      - http
  alert_manager:
    deploy:
      depends_on:
      - prometheus
      env: []
      healthcheck:
        interval: 30s
        retries: 3
        start_period: 30s
        test:
        - CMD-SHELL
        - nc -z localhost 9093 || (echo > /dev/tcp/localhost/9093) 2>/dev/null ||
          true
        timeout: 10s
      image: prom/alertmanager:v0.26.0
      ports:
      - 9093
      volumes: []
      zone: internal_zone
    kind: monitor
    name: alert_manager
    simulate:
      behaviors: []
      hostname: alerts.internal_developer_platform.internal
      issues: []
      role: Alert management for monitoring stack
      secrets: []
      services:
      - http
  api_gateway:
    deploy:
      depends_on:
      - nginx_proxy
      env: []
      healthcheck:
        interval: 30s
        retries: 3
        start_period: 30s
        test:
        - CMD-SHELL
        - curl -sf http://localhost:80 || wget -qO- http://localhost:80 || true
        timeout: 10s
      image: nginx:1.25-alpine
      ports:
      - 80
      volumes: []
      zone: internal_zone
    kind: web
    name: api_gateway
    simulate:
      behaviors: []
      hostname: api.internal_developer_platform.internal
      issues: []
      role: API gateway for internal services
      secrets: []
      services:
      - http
  artifact_store:
