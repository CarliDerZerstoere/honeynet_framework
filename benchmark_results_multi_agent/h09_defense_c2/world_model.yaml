    deploy:
      command:
      - minio
      - server
      - /data
      depends_on: []
      env: []
      healthcheck:
        interval: 30s
        retries: 3
        start_period: 30s
        test:
        - CMD
        - curl
        - -f
        - http://localhost:9000/minio/health/live
        timeout: 10s
      image: minio/minio:latest
      ports:
      - 9000
      volumes: []
      zone: data_zone
    kind: storage
    name: file_share_service
    simulate:
      behaviors: []
      hostname: file-share.data.military.internal
      issues: []
      role: File sharing service for data exchange
      secrets: []
      services: []
