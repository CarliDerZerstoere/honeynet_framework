zones:
  command_zone:
    deploy:
      driver: bridge
      internal: false
      network_name: command_zone
    name: command_zone
  data_zone:
    deploy:
      driver: bridge
      internal: true
      network_name: data_zone
    name: data_zone
  intel_zone:
    deploy:
      driver: bridge
      internal: true
      network_name: intel_zone
    name: intel_zone
  security_zone:
    deploy:
      driver: bridge
      internal: true
      network_name: security_zone
    name: security_zone
  tactical_zone:
    deploy:
      driver: bridge
      internal: true
      network_name: tactical_zone
    name: tactical_zone
