organization:
  business_units: []
  name: military_command_and_control
  regions: []
  type: ''
secrets:
  tactical_db_admin_password:
    name: tactical_db_admin_password
    simulate:
      age_days: 0
      known_to: []
      leaked_in: []
      reused_by: []
      strength: medium
    type: credential
  vault_root_token:
    name: vault_root_token
    simulate:
      age_days: 0
      known_to: []
      leaked_in: []
      reused_by: []
      strength: medium
    type: token
systems:
  admin_ui:
    deploy:
      depends_on:
      - tactical_db
      env: []
      healthcheck:
        interval: 30s
        retries: 3
        start_period: 30s
        test:
        - CMD-SHELL
        - curl -sf http://localhost:8080/ || wget -qO- http://localhost:8080/ || true
        timeout: 10s
      image: adminer:4
      ports:
      - 8080
      volumes: []
      zone: tactical_zone
    kind: web
    name: admin_ui
    simulate:
      behaviors: []
      hostname: admin-ui.tactical.military.internal
      issues: []
      role: Admin UI for database management
      secrets: []
      services: []
  alerting_service:
    deploy:
      depends_on:
      - log_collector
      env: []
      healthcheck:
        interval: 30s
        retries: 3
        start_period: 30s
        test:
        - CMD-SHELL
        - nc -z localhost 9093 || (echo > /dev/tcp/localhost/9093) 2>/dev/null ||
          true
        timeout: 10s
      image: prom/alertmanager:v0.26.0
      ports:
      - 9093
      volumes: []
      zone: security_zone
    kind: monitor
    name: alerting_service
    simulate:
      behaviors: []
      hostname: alerting.security.military.internal
      issues: []
      role: Alerting service for monitoring alerts
      secrets: []
      services: []
  api_gateway:
    deploy:
      depends_on: []
      env: []
      healthcheck:
        interval: 30s
        retries: 3
        start_period: 30s
        test:
        - CMD-SHELL
        - curl -sf http://localhost/ || wget -qO- http://localhost/ || true
        timeout: 10s
      image: nginx:1.25-alpine
      ports:
      - 80
      volumes: []
      zone: command_zone
    kind: web
    name: api_gateway
    simulate:
      behaviors: []
      hostname: api-gateway.command.military.internal
      issues: []
      role: API gateway for managing API requests
      secrets: []
      services: []
  audit_trail_service:
    deploy:
      depends_on: []
      env: []
      healthcheck:
        interval: 30s
        retries: 3
        start_period: 30s
        test:
        - CMD
        - curl
        - -f
        - http://localhost:3000/
        timeout: 10s
      image: grafana/grafana:10.2.0
      ports:
      - 3000
      volumes: []
      zone: security_zone
    kind: runtime
    name: audit_trail_service
    simulate:
      behaviors: []
      hostname: audit-trail.security.military.internal
      issues: []
      role: Service for compliance and audit trail logging
      secrets: []
      services: []
  command_portal:
    deploy:
      depends_on: []
      env: []
      healthcheck:
        interval: 30s
        retries: 3
        start_period: 30s
        test:
        - CMD-SHELL
        - curl -sf http://localhost/ || wget -qO- http://localhost/ || true
        timeout: 10s
      image: nginx:1.25-alpine
      ports:
      - 80
      volumes: []
      zone: command_zone
    kind: web
    name: command_portal
    simulate:
      behaviors: []
      hostname: command-portal.command.military.internal
      issues: []
      role: Web-based command portal for officers
      secrets: []
      services: []
  compliance_service:
    deploy:
      depends_on:
      - audit_trail_service
      env: []
      healthcheck:
        interval: 30s
        retries: 3
        start_period: 30s
        test:
        - CMD-SHELL
        - nc -z localhost 9093 || (echo > /dev/tcp/localhost/9093) 2>/dev/null ||
          true
        timeout: 10s
      image: prom/alertmanager:v0.26.0
      ports:
      - 9093
      volumes: []
      zone: security_zone
    kind: runtime
    name: compliance_service
    simulate:
      behaviors: []
      hostname: compliance.security.military.internal
      issues: []
      role: Compliance service for security regulations
      secrets: []
      services: []
  coordination_service:
    deploy:
      command:
      - --config
      - nats-server.conf
      depends_on: []
      env: []
      healthcheck:
        interval: 30s
        retries: 3
        start_period: 30s
        test:
        - CMD
        - nats
        - ping
        timeout: 10s
      image: nats:2.10
      ports:
      - 4222
      - 6222
      - 8222
      volumes: []
      zone: tactical_zone
    kind: infra
    name: coordination_service
    simulate:
      behaviors: []
      hostname: coordination.tactical.military.internal
      issues: []
      role: Service coordination for tactical operations
      secrets: []
      services: []
