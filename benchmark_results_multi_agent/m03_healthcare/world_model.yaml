organization:
  business_units: []
  name: hipaa_healthcare_it
  regions: []
  type: ''
secrets:
  admin_panel_password:
    name: admin_panel_password
    simulate:
      age_days: 0
      known_to: []
      leaked_in: []
      reused_by: []
      strength: medium
    type: credential
  couchdb_admin_password:
    name: couchdb_admin_password
    simulate:
      age_days: 0
      known_to: []
      leaked_in: []
      reused_by: []
      strength: medium
    type: credential
  db_admin_password:
    name: db_admin_password
    simulate:
      age_days: 0
      known_to: []
      leaked_in: []
      reused_by: []
      strength: medium
    type: credential
  ehr_api_key:
    name: ehr_api_key
    simulate:
      age_days: 0
      known_to: []
      leaked_in: []
      reused_by: []
      strength: medium
    type: api_key
systems:
  admin_panel:
    deploy:
      depends_on:
      - patient_db
      env: []
      healthcheck:
        interval: 30s
        retries: 3
        start_period: 30s
        test:
        - CMD
        - curl
        - -f
        - http://localhost/
        timeout: 10s
      image: drupal:10-apache
      ports:
      - 80
      volumes: []
      zone: internal_zone
    kind: web
    name: admin_panel
    simulate:
      behaviors: []
      hostname: admin.internal.hipaa_healthcare_it.org
      issues: []
      role: Internal admin panel for managing system configurations
      secrets:
      - admin_panel_password
      services: []
  api_gateway:
    deploy:
      command:
      - envoy
      - -c
      - /etc/envoy/envoy.yaml
      depends_on:
      - fhir_service
      env: []
      healthcheck:
        interval: 30s
        retries: 3
        start_period: 30s
        test:
        - CMD
        - curl
        - -f
        - http://localhost:10000/
        timeout: 10s
      image: envoyproxy/envoy:v1.28-latest
      ports:
      - 10000
      volumes: []
      zone: internal_zone
    kind: web
    name: api_gateway
    simulate:
      behaviors: []
      hostname: gateway.hipaa_healthcare_it.org
      issues: []
      role: API gateway for managing and routing API requests
      secrets: []
      services: []
  audit_logging_service:
    deploy:
      command:
      - -config.file=/etc/loki/local-config.yaml
      depends_on: []
      env: []
      healthcheck:
        interval: 30s
        retries: 3
        start_period: 30s
        test:
        - CMD
        - curl
        - -f
        - http://localhost:3100/ready
        timeout: 10s
      image: grafana/loki:2.9.3
      ports:
      - 3100
      volumes: []
      zone: internal_zone
    kind: monitor
    name: audit_logging_service
    simulate:
      behaviors: []
      hostname: audit.internal.hipaa_healthcare_it.org
      issues: []
      role: Service for collecting and managing audit logs
      secrets: []
      services: []
  backup_service:
    deploy:
      command:
      - minio
      - server
      - /data
      depends_on:
      - patient_db
      env: []
      healthcheck:
        interval: 30s
        retries: 3
        start_period: 30s
        test:
        - CMD-SHELL
        - nc -z localhost 9000 || (echo > /dev/tcp/localhost/9000) 2>/dev/null ||
          true
        timeout: 10s
      image: minio/minio:latest
      ports:
      - 9000
      volumes: []
      zone: data_zone
    kind: storage
    name: backup_service
    simulate:
      behaviors: []
      hostname: backup.data.hipaa_healthcare_it.org
      issues: []
      role: Backup service for critical data storage
      secrets: []
      services: []
  fake_backup_server:
    deploy:
      command:
      - minio
      - server
      - /data
      depends_on: []
      env: []
      healthcheck:
        interval: 30s
        retries: 3
        start_period: 30s
        test:
        - CMD-SHELL
        - nc -z localhost 9000 || (echo > /dev/tcp/localhost/9000) 2>/dev/null ||
          true
        timeout: 10s
      image: minio/minio:latest
      ports:
      - 9000
      volumes: []
      zone: internal_zone
    kind: storage
    name: fake_backup_server
    simulate:
      behaviors: []
      hostname: fake-backup.internal.hipaa_healthcare_it.org
      issues: []
      role: Decoy backup server to mislead attackers
      secrets: []
      services: []
  fhir_service:
    deploy:
      depends_on:
      - patient_db
      env: []
      healthcheck:
        interval: 30s
        retries: 3
        start_period: 30s
        test:
        - CMD
        - curl
        - -f
        - http://localhost/
        timeout: 10s
      image: caddy:2
      ports:
      - 80
      volumes: []
      zone: internal_zone
    kind: web
    name: fhir_service
    simulate:
      behaviors: []
      hostname: fhir.internal.hipaa_healthcare_it.org
      issues: []
      role: FHIR-compliant data service for healthcare interoperability
      secrets: []
      services: []
  honeypot_admin_panel:
    deploy:
      depends_on: []
      env: []
      healthcheck:
        interval: 30s
        retries: 3
        start_period: 30s
        test:
        - CMD
        - curl
        - -f
        - http://localhost/
        timeout: 10s
      image: phpmyadmin:5.2
      ports:
      - 80
      volumes: []
      zone: public_zone
    kind: web
    name: honeypot_admin_panel
    simulate:
      behaviors: []
      hostname: honeypot-admin.hipaa_healthcare_it.org
      issues: []
      role: Decoy admin panel to attract unauthorized access attempts
      secrets: []
      services: []
  load_balancer:
    deploy:
      command:
      - traefik
      depends_on:
      - reverse_proxy
      env: []
      healthcheck:
        interval: 30s
        retries: 3
        start_period: 30s
        test:
        - CMD
        - curl
        - -f
        - http://localhost/
        timeout: 10s
      image: traefik:v2.10
      ports:
      - 80
      volumes: []
      zone: public_zone
    kind: infra
    name: load_balancer
    simulate:
      behaviors: []
      hostname: lb.hipaa_healthcare_it.org
      issues: []
      role: Load balancer for distributing traffic across services
      secrets: []
      services: []
  log_collector:
    deploy:
      depends_on:
      - audit_logging_service
      env:
      - LD_PRELOAD=/usr/lib/preload.so
      healthcheck:
        interval: 30s
        retries: 3
        start_period: 30s
        test:
        - CMD-SHELL
        - nc -z localhost 24224 || (echo > /dev/tcp/localhost/24224) 2>/dev/null ||
          true
        timeout: 10s
      image: fluent/fluentd:v1.16
      ports:
      - 24224
      - 5140
      volumes: []
      zone: internal_zone
    kind: monitor
    name: log_collector
    simulate:
      behaviors: []
      hostname: log-collector.internal.hipaa_healthcare_it.org
      issues: []
      role: Service for collecting and aggregating logs
      secrets: []
      services: []
  monitoring_service:
    deploy:
      depends_on: []
      env: []
      healthcheck:
        interval: 30s
        retries: 3
        start_period: 30s
        test:
        - CMD-SHELL
        - nc -z localhost 3100 || (echo > /dev/tcp/localhost/3100) 2>/dev/null ||
          true
        timeout: 10s
      image: grafana/loki:2.9.3
      ports:
      - 3100
      volumes: []
      zone: internal_zone
    kind: monitor
    name: monitoring_service
    simulate:
      behaviors: []
      hostname: monitor.internal.hipaa_healthcare_it.org
      issues: []
      role: Monitoring service for system health and performance
      secrets: []
      services: []
  patient_db:
    deploy:
      depends_on: []
      env:
      - POSTGRES_PASSWORD=admin123
      healthcheck:
        interval: 30s
        retries: 3
        start_period: 30s
        test:
        - CMD
        - pg_isready
        - -U
        - postgres
        timeout: 10s
      image: postgres:16-alpine
      ports:
      - 5432
      volumes: []
      zone: data_zone
    kind: database
    name: patient_db
    simulate:
      behaviors: []
      hostname: db01.data.hipaa_healthcare_it.org
      issues: []
      role: PostgreSQL database storing patient records
      secrets:
      - db_admin_password
      services: []
  patient_portal:
    deploy:
      depends_on: []
      env: []
      healthcheck:
        interval: 30s
        retries: 3
        start_period: 30s
        test:
        - CMD
        - curl
        - -f
        - http://localhost/
        timeout: 10s
      image: drupal:10-apache
      ports:
      - 80
      volumes: []
      zone: public_zone
    kind: web
    name: patient_portal
    simulate:
      behaviors: []
      hostname: portal.hipaa_healthcare_it.org
      issues: []
      role: Public-facing patient portal for accessing personal health information
      secrets: []
      services: []
  pgadmin:
    deploy:
      depends_on:
      - patient_db
      env:
      - PGADMIN_DEFAULT_EMAIL=admin@healthcare.org
      - PGADMIN_DEFAULT_PASSWORD=admin
      healthcheck:
        interval: 30s
        retries: 3
        start_period: 30s
        test:
        - CMD-SHELL
        - curl -sf http://localhost/ || wget -qO- http://localhost/ || true
        timeout: 10s
      image: dpage/pgadmin4:latest
      ports:
      - 80
      volumes: []
      zone: internal_zone
    kind: web
    name: pgadmin
    simulate:
      behaviors: []
      hostname: pgadmin.internal.hipaa_healthcare_it.org
      issues: []
      role: Database administration interface for PostgreSQL
      secrets: []
      services: []
  reverse_proxy:
    deploy:
      depends_on:
      - patient_portal
      env: []
      healthcheck:
        interval: 30s
        retries: 3
        start_period: 30s
        test:
        - CMD
        - curl
        - -f
        - http://localhost/
        timeout: 10s
      image: nginx:1.25-alpine
      ports:
      - 80
      volumes: []
      zone: public_zone
    kind: web
    name: reverse_proxy
    simulate:
      behaviors: []
      hostname: proxy.hipaa_healthcare_it.org
      issues: []
      role: Reverse proxy for routing external traffic to internal services
      secrets: []
      services: []
  service_discovery:
    deploy:
      command:
      - agent
      - -dev
      - -client
      - 0.0.0.0
      depends_on: []
      env: []
      healthcheck:
        interval: 30s
        retries: 3
        start_period: 30s
        test:
        - CMD
        - consul
        - members
        timeout: 10s
      image: hashicorp/consul:1.17
      ports:
      - 8300
      - 8301
      - 8302
      - 8500
      - 8600
      volumes: []
      zone: internal_zone
    kind: infra
    name: service_discovery
    simulate:
      behaviors: []
      hostname: discovery.internal.hipaa_healthcare_it.org
      issues: []
      role: Service discovery for internal network services
      secrets: []
      services: []
zones:
  data_zone:
    deploy:
      driver: bridge
      internal: true
      network_name: data_zone
    name: data_zone
  internal_zone:
    deploy:
      driver: bridge
      internal: true
      network_name: internal_zone
    name: internal_zone
  public_zone:
    deploy:
      driver: bridge
      internal: false
      network_name: public_zone
    name: public_zone
