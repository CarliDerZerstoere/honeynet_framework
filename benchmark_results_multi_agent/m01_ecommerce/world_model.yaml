organization:
  business_units: []
  name: mid_size_ecommerce_company
  regions: []
  type: ''
secrets:
  admin_panel_password:
    name: admin_panel_password
    simulate:
      age_days: 0
      known_to: []
      leaked_in: []
      reused_by: []
      strength: medium
    type: credential
  api_key_payment_service:
    name: api_key_payment_service
    simulate:
      age_days: 0
      known_to: []
      leaked_in: []
      reused_by: []
      strength: medium
    type: api_key
  db_admin_password:
    name: db_admin_password
    simulate:
      age_days: 0
      known_to: []
      leaked_in: []
      reused_by: []
      strength: medium
    type: credential
  elasticsearch_api_key:
    name: elasticsearch_api_key
    simulate:
      age_days: 0
      known_to: []
      leaked_in: []
      reused_by: []
      strength: medium
    type: api_key
  redis_password:
    name: redis_password
    simulate:
      age_days: 0
      known_to: []
      leaked_in: []
      reused_by: []
      strength: medium
    type: credential
systems:
  admin_panel:
    deploy:
      depends_on: []
      env: []
      healthcheck:
        interval: 30s
        retries: 3
        start_period: 30s
        test:
        - CMD
        - curl
        - -f
        - http://localhost:8080
        timeout: 10s
      image: adminer:4
      ports:
      - 8080
      volumes: []
      zone: public_zone
    kind: web
    name: admin_panel
    simulate:
      behaviors: []
      hostname: admin.midshop.internal
      issues: []
      role: Admin panel for database management
      secrets: []
      services: []
  alerting_service:
    deploy:
      depends_on: []
      env: []
      healthcheck:
        interval: 30s
        retries: 3
        start_period: 30s
        test:
        - CMD-SHELL
        - nc -z localhost 9093 || (echo > /dev/tcp/localhost/9093) 2>/dev/null ||
          true
        timeout: 10s
      image: prom/alertmanager:v0.26.0
      ports:
      - 9093
      volumes: []
      zone: internal_zone
    kind: monitor
    name: alerting_service
    simulate:
      behaviors: []
      hostname: alerting.midshop.internal
      issues: []
      role: Alertmanager for monitoring alerts
      secrets: []
      services: []
  api_gateway:
    deploy:
      depends_on:
      - web_storefront
      env: []
      healthcheck:
        interval: 30s
        retries: 3
        start_period: 30s
        test:
        - CMD
        - curl
        - -f
        - http://localhost
        timeout: 10s
      image: nginx:1.25-alpine
      ports:
      - 80
      volumes: []
      zone: public_zone
    kind: web
    name: api_gateway
    simulate:
      behaviors: []
      hostname: gateway.midshop.internal
      issues: []
      role: API gateway for routing external requests
      secrets: []
      services: []
  backup_server:
    deploy:
      depends_on: []
      env: []
      healthcheck:
        interval: 30s
        retries: 3
        start_period: 30s
        test:
        - CMD-SHELL
        - clickhouse-client --query 'SELECT 1'
        timeout: 10s
      image: clickhouse/clickhouse-server:23.12
      ports:
      - 8123
      - 9000
      - 9009
      volumes: []
      zone: data_zone
    kind: storage
    name: backup_server
    simulate:
      behaviors: []
      hostname: backup.midshop.internal
      issues: []
      role: Backup server for data storage
      secrets: []
      services: []
  bait_admin_panel:
    deploy:
      depends_on: []
      env: []
      healthcheck:
        interval: 30s
        retries: 3
        start_period: 30s
        test:
        - CMD
        - curl
        - -f
        - http://localhost
        timeout: 10s
      image: drupal:10-apache
      ports:
      - 80
      volumes: []
      zone: public_zone
    kind: web
    name: bait_admin_panel
    simulate:
      behaviors: []
      hostname: bait.admin.midshop.internal
      issues: []
      role: Decoy admin panel to attract attackers
      secrets: []
      services: []
  elasticsearch:
    deploy:
      depends_on: []
      env: []
      healthcheck:
        interval: 30s
        retries: 3
        start_period: 30s
        test:
        - CMD-SHELL
        - curl -sf http://localhost:9200/_cluster/health || wget -qO- http://localhost:9200/_cluster/health
          || true
        timeout: 10s
      image: elasticsearch:8.11.0
      ports:
      - 9200
      - 9300
      volumes: []
      zone: data_zone
    kind: runtime
    name: elasticsearch
    simulate:
      behaviors: []
      hostname: elasticsearch.data.midshop.internal
      issues: []
      role: Elasticsearch node for data indexing
      secrets: []
      services: []
  file_share:
    deploy:
      depends_on: []
      env:
      - COUCHDB_USER=admin
      - COUCHDB_PASSWORD=weakpassword
      healthcheck:
        interval: 30s
        retries: 3
        start_period: 30s
        test:
        - CMD-SHELL
        - curl -sf http://localhost:5984/_up || exit 1
        timeout: 10s
      image: couchdb:3.3
      ports:
      - 4369
      - 5984
      - 9100
      volumes: []
      zone: data_zone
    kind: storage
    name: file_share
    simulate:
      behaviors: []
      hostname: fileshare.midshop.internal
      issues: []
      role: CouchDB service for file sharing
      secrets: []
      services: []
  filebeat:
    deploy:
      depends_on:
      - log_collector
      env: []
      healthcheck:
        interval: 30s
        retries: 3
        start_period: 30s
        test:
        - CMD-SHELL
        - 'true'
        timeout: 10s
      image: docker.elastic.co/beats/filebeat:8.11.0
      ports: []
      volumes: []
      zone: internal_zone
    kind: monitor
    name: filebeat
    simulate:
      behaviors: []
      hostname: filebeat.midshop.internal
      issues: []
      role: Log shipper for collecting and forwarding logs
      secrets: []
      services: []
  identity_service:
    deploy:
      depends_on: []
      env: []
      healthcheck:
        interval: 30s
        retries: 3
        start_period: 30s
        test:
        - CMD-SHELL
        - consul members | grep -q alive
        timeout: 10s
      image: hashicorp/consul:1.17
      ports:
      - 8300
      - 8301
      - 8302
      - 8500
      - 8600
      volumes: []
      zone: internal_zone
    kind: identity
    name: identity_service
    simulate:
      behaviors: []
      hostname: identity.midshop.internal
      issues: []
      role: Consul service for identity management
      secrets: []
      services: []
  log_collector:
    deploy:
      depends_on: []
      env: []
      healthcheck:
        interval: 30s
        retries: 3
        start_period: 30s
        test:
        - CMD-SHELL
        - nc -z localhost 3100 || (echo > /dev/tcp/localhost/3100) 2>/dev/null ||
          true
        timeout: 10s
      image: grafana/loki:2.9.3
      ports:
      - 3100
      volumes: []
      zone: internal_zone
    kind: monitor
    name: log_collector
    simulate:
      behaviors: []
      hostname: logs.midshop.internal
      issues: []
      role: Loki service for log collection
      secrets: []
      services: []
  monitoring_dashboard:
    deploy:
      depends_on: []
      env: []
      healthcheck:
        interval: 30s
        retries: 3
        start_period: 30s
        test:
        - CMD-SHELL
        - nc -z localhost 3000 || (echo > /dev/tcp/localhost/3000) 2>/dev/null ||
          true
        timeout: 10s
      image: grafana/grafana:10.2.0
      ports:
      - 3000
      volumes: []
      zone: internal_zone
    kind: monitor
    name: monitoring_dashboard
    simulate:
      behaviors: []
      hostname: monitoring.midshop.internal
      issues: []
      role: Grafana dashboard for monitoring
      secrets: []
      services: []
  notification_service:
    deploy:
      depends_on: []
      env: []
      healthcheck:
        interval: 30s
        retries: 3
        start_period: 30s
        test:
        - CMD-SHELL
        - nc -z localhost 4222 || (echo > /dev/tcp/localhost/4222) 2>/dev/null ||
          true
        timeout: 10s
      image: nats:2.10
      ports:
      - 4222
      - 6222
      - 8222
      volumes: []
      zone: internal_zone
    kind: runtime
    name: notification_service
    simulate:
      behaviors: []
      hostname: notification.midshop.internal
      issues: []
      role: NATS service for handling notifications
      secrets: []
      services: []
  orders_db:
    deploy:
      depends_on: []
      env:
      - POSTGRES_PASSWORD=admin123
      healthcheck:
        interval: 30s
        retries: 3
        start_period: 30s
        test:
        - CMD
        - pg_isready
        - -U
        - postgres
        timeout: 10s
      image: postgres:16-alpine
      ports:
      - 5432
      volumes: []
      zone: data_zone
    kind: database
    name: orders_db
    simulate:
      behaviors: []
      hostname: db.orders.midshop.internal
      issues: []
      role: PostgreSQL database for order management
      secrets: []
      services: []
  payment_service:
    deploy:
      depends_on: []
      env: []
      healthcheck:
        interval: 30s
        retries: 3
        start_period: 30s
        test:
        - CMD-SHELL
        - curl -sf http://localhost:80 || wget -qO- http://localhost:80 || true
        timeout: 10s
      image: drupal:10-apache
      ports:
      - 80
      volumes: []
      zone: payment_zone
    kind: web
    name: payment_service
    simulate:
      behaviors: []
      hostname: payment.service.midshop.internal
      issues: []
      role: Payment processing microservice
      secrets: []
      services: []
  pgadmin:
    deploy:
      depends_on:
      - orders_db
      env:
      - PGADMIN_DEFAULT_EMAIL=admin@midshop.internal
      - PGADMIN_DEFAULT_PASSWORD=pgadminpass
      healthcheck:
        interval: 30s
        retries: 3
        start_period: 30s
        test:
        - CMD-SHELL
        - curl -sf http://localhost/ || wget -qO- http://localhost/ || true
        timeout: 10s
      image: dpage/pgadmin4:6.21
      ports:
      - 80
      volumes: []
      zone: internal_zone
    kind: web
    name: pgadmin
    simulate:
      behaviors: []
      hostname: pgadmin.midshop.internal
      issues: []
      role: Database administration tool for PostgreSQL
      secrets: []
      services: []
  redis_cart:
    deploy:
      depends_on: []
      env: []
      healthcheck:
        interval: 30s
        retries: 3
        start_period: 30s
        test:
        - CMD
        - redis-cli
        - ping
        timeout: 10s
      image: redis:7-alpine
      ports:
      - 6379
      volumes: []
      zone: internal_zone
    kind: runtime
    name: redis_cart
    simulate:
      behaviors: []
      hostname: redis.cart.midshop.internal
      issues: []
      role: Session and cart store using Redis
      secrets: []
      services: []
  reverse_proxy:
    deploy:
      depends_on:
      - api_gateway
      env: []
      healthcheck:
        interval: 30s
        retries: 3
        start_period: 30s
        test:
        - CMD
        - curl
        - -f
        - http://localhost
        timeout: 10s
      image: nginx:1.25-alpine
      ports:
      - 80
      volumes: []
      zone: public_zone
    kind: web
    name: reverse_proxy
    simulate:
      behaviors: []
      hostname: proxy.midshop.internal
      issues: []
      role: Reverse proxy for load balancing
      secrets: []
      services: []
  search_service:
    deploy:
      depends_on: []
      env: []
      healthcheck:
        interval: 30s
        retries: 3
        start_period: 30s
        test:
        - CMD
        - curl
        - -f
        - http://localhost:9200
        timeout: 10s
      image: elasticsearch:8.11.0
      ports:
      - 9200
      - 9300
      volumes: []
      zone: internal_zone
    kind: runtime
    name: search_service
    simulate:
      behaviors: []
      hostname: search.midshop.internal
      issues: []
      role: Elasticsearch service for product search
      secrets: []
      services: []
  web_storefront:
    deploy:
      command:
      - node
      - current/index.js
      depends_on:
      - redis_cart
      env:
      - database__client=mysql
      - database__connection__host=mysql
      - database__connection__user=root
      - database__connection__password=weakpassword
      - database__connection__database=ghost_db
      - NODE_ENV=production
      - GHOST_INSTALL=/var/lib/ghost
      - GHOST_CONTENT=/var/lib/ghost
      - GHOST_VERSION=5.130.6
      - GHOST_CLI_VERSION=1.28.4
      - NODE_VERSION=20.20.0
      - YARN_VERSION=1.22.22
      - GOSU_VERSION=1.19
      - DATABASE_HOST=mysql
      healthcheck:
        interval: 30s
        retries: 3
        start_period: 30s
        test:
        - CMD
        - curl
        - -f
        - http://localhost:2368
        timeout: 10s
      image: ghost:5
      ports:
      - 2368
      volumes: []
      zone: internal_zone
    kind: web
    name: web_storefront
    simulate:
      behaviors: []
      hostname: storefront.midshop.internal
      issues: []
      role: Public web storefront for customer interactions
      secrets: []
      services: []
zones:
  data_zone:
    deploy:
      driver: bridge
      internal: true
      network_name: data_zone
    name: data_zone
  internal_zone:
    deploy:
      driver: bridge
      internal: true
      network_name: internal_zone
    name: internal_zone
  payment_zone:
    deploy:
      driver: bridge
      internal: true
      network_name: payment_zone
    name: payment_zone
  public_zone:
    deploy:
      driver: bridge
      internal: false
      network_name: public_zone
    name: public_zone
