organization:
  business_units: []
  name: programmatic_advertising_platform
  regions: []
  type: ''
secrets:
  db_admin_password:
    name: db_admin_password
    simulate:
      age_days: 0
      known_to: []
      leaked_in: []
      reused_by: []
      strength: medium
    type: credential
systems:
  ad_server:
    deploy:
      depends_on:
      - bid_cache
      - campaign_db
      env: []
      healthcheck:
        interval: 30s
        retries: 3
        start_period: 30s
        test:
        - CMD-SHELL
        - nc -z localhost 80 || (echo > /dev/tcp/localhost/80) 2>/dev/null || true
        timeout: 10s
      image: nginx:1.25-alpine
      ports:
      - 80
      volumes: []
      zone: public_zone
    kind: web
    name: ad_server
    simulate:
      behaviors: []
      hostname: adserver.public.programmaticad.internal
      issues: []
      role: Public ad serving API returning creatives
      secrets: []
      services: []
  admin_panel:
    deploy:
      depends_on:
      - campaign_db
      env: []
      healthcheck:
        interval: 30s
        retries: 3
        start_period: 30s
        test:
        - CMD-SHELL
        - nc -z localhost 80 || (echo > /dev/tcp/localhost/80) 2>/dev/null || true
        timeout: 10s
      image: phpmyadmin:5.2
      ports:
      - 80
      volumes: []
      zone: public_zone
    kind: web
    name: admin_panel
    simulate:
      behaviors: []
      hostname: adminpanel.public.programmaticad.internal
      issues: []
      role: Web interface for database administration
      secrets: []
      services: []
  alert_manager:
    deploy:
      depends_on: []
      env: []
      healthcheck:
        interval: 30s
        retries: 3
        start_period: 30s
        test:
        - CMD-SHELL
        - nc -z localhost 9093 || (echo > /dev/tcp/localhost/9093) 2>/dev/null ||
          true
        timeout: 10s
      image: prom/alertmanager:v0.26.0
      ports:
      - 9093
      volumes: []
      zone: analytics_zone
    kind: monitor
    name: alert_manager
    simulate:
      behaviors: []
      hostname: alertmanager.analytics.programmaticad.internal
      issues: []
      role: Manages alert notifications and responses
      secrets: []
      services: []
  api_monitor:
    deploy:
      depends_on: []
      env:
      - LD_PRELOAD=/usr/lib/preload.so
      healthcheck:
        interval: 30s
        retries: 3
        start_period: 30s
        test:
        - CMD-SHELL
        - nc -z localhost 24224 || (echo > /dev/tcp/localhost/24224) 2>/dev/null ||
          true
        timeout: 10s
      image: fluent/fluentd:v1.16
      ports:
      - 24224
      - 5140
      volumes: []
      zone: analytics_zone
    kind: monitor
    name: api_monitor
    simulate:
      behaviors: []
      hostname: apimonitor.analytics.programmaticad.internal
      issues: []
      role: Monitors API performance and availability
      secrets: []
      services: []
  backup_server:
    deploy:
      depends_on: []
      env:
      - COUCHDB_USER=admin
      - COUCHDB_PASSWORD=password
      healthcheck:
        interval: 30s
        retries: 3
        start_period: 30s
        test:
        - CMD
        - curl
        - -f
        - http://localhost:5984/_up
        timeout: 10s
      image: couchdb:3.3
      ports:
      - 4369
      - 5984
      - 9100
      volumes: []
      zone: backend_zone
    kind: storage
    name: backup_server
    simulate:
      behaviors: []
      hostname: backupserver.backend.programmaticad.internal
      issues: []
      role: Server dedicated to data backup and recovery
      secrets: []
      services: []
  bid_cache:
    deploy:
      depends_on: []
      env: []
      healthcheck:
        interval: 30s
        retries: 3
        start_period: 30s
        test:
        - CMD
        - redis-cli
        - ping
        timeout: 10s
      image: redis:7-alpine
      ports:
      - 6379
      volumes: []
      zone: backend_zone
    kind: unknown
    name: bid_cache
    simulate:
      behaviors: []
      hostname: bidcache.backend.programmaticad.internal
      issues: []
      role: Real-time bid cache for ad auctions
      secrets: []
      services: []
  cache_admin:
    deploy:
      depends_on:
      - bid_cache
      env: []
      healthcheck:
        interval: 30s
        retries: 3
        start_period: 30s
        test:
        - CMD
        - redis-cli
        - ping
        timeout: 10s
      image: redis:7-alpine
      ports:
      - 6379
      volumes: []
      zone: backend_zone
    kind: infra
    name: cache_admin
    simulate:
      behaviors: []
      hostname: cacheadmin.backend.programmaticad.internal
      issues: []
      role: Admin interface for managing cache
      secrets: []
      services: []
  campaign_db:
    deploy:
      depends_on: []
      env:
      - MYSQL_ROOT_PASSWORD=weakpassword
      - MYSQL_DATABASE=campaign_db
      - MYSQL_USER=admin
      - MYSQL_PASSWORD=weakpassword
      healthcheck:
        interval: 30s
        retries: 3
        start_period: 30s
        test:
        - CMD
        - mysqladmin
        - ping
        - -h
        - localhost
        timeout: 10s
      image: mariadb:11
      ports:
      - 3306
      volumes: []
      zone: backend_zone
    kind: database
    name: campaign_db
    simulate:
      behaviors: []
      hostname: campaigndb.backend.programmaticad.internal
      issues: []
      role: Stores campaign data for ad targeting
      secrets:
      - db_admin_password
      services: []
  click_tracker:
    deploy:
      depends_on:
      - campaign_db
      env: []
      healthcheck:
        interval: 30s
        retries: 3
        start_period: 30s
        test:
        - CMD-SHELL
        - nc -z localhost 3000 || (echo > /dev/tcp/localhost/3000) 2>/dev/null ||
          true
        timeout: 10s
      image: grafana/grafana:10.2.0
      ports:
      - 3000
      volumes: []
      zone: public_zone
    kind: web
    name: click_tracker
    simulate:
      behaviors: []
      hostname: clicktracker.public.programmaticad.internal
      issues: []
      role: Logs impressions and conversions
      secrets: []
      services: []
  data_backup:
    deploy:
      depends_on:
      - campaign_db
      env:
      - MYSQL_ROOT_PASSWORD=weakpassword
      - MYSQL_DATABASE=backup_db
      - MYSQL_USER=backup_admin
      - MYSQL_PASSWORD=weakpassword
      healthcheck:
        interval: 30s
        retries: 3
        start_period: 30s
        test:
        - CMD
        - mysqladmin
        - ping
        - -h
        - localhost
        timeout: 10s
      image: mariadb:11
      ports:
      - 3306
      volumes: []
      zone: backend_zone
    kind: storage
    name: data_backup
    simulate:
      behaviors: []
      hostname: backup.backend.programmaticad.internal
      issues: []
      role: Backs up critical data from databases
      secrets: []
      services: []
  db_admin_ui:
    deploy:
      depends_on:
      - campaign_db
      env:
      - PMA_HOST=campaign_db
      - PMA_USER=admin
      - PMA_PASSWORD=admin123
