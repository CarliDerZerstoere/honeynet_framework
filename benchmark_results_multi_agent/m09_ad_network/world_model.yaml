      volumes: []
      zone: backend_zone
    kind: infra
    name: db_admin_ui
    simulate:
      behaviors: []
      hostname: dbadminui.backend.programmaticad.internal
      issues: []
      role: Database administration user interface
      secrets: []
      services: []
