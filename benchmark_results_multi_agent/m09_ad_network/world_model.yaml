zones:
  analytics_zone:
    deploy:
      driver: bridge
      internal: true
      network_name: analytics_zone
    name: analytics_zone
  backend_zone:
    deploy:
      driver: bridge
      internal: true
      network_name: backend_zone
    name: backend_zone
  public_zone:
    deploy:
      driver: bridge
      internal: false
      network_name: public_zone
    name: public_zone
