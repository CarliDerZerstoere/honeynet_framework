        - http://localhost:9000/minio/health/live
        timeout: 10s
      image: minio/minio:latest
      ports:
      - 9000
      volumes: []
      zone: internal_zone
    kind: storage
    name: feature_store
    simulate:
      behaviors: []
      hostname: feature-store.internal.production_ml_platform.internal
      issues: []
      role: Feature store for ML features
      secrets:
      - feature_store_access_key
