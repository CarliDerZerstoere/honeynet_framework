zones:
  data_zone:
    deploy:
      driver: bridge
      internal: true
      network_name: data_zone
    name: data_zone
  internal_zone:
    deploy:
      driver: bridge
      internal: true
      network_name: internal_zone
    name: internal_zone
  ops_zone:
    deploy:
      driver: bridge
      internal: true
      network_name: ops_zone
    name: ops_zone
  public_zone:
    deploy:
      driver: bridge
      internal: false
      network_name: public_zone
    name: public_zone
