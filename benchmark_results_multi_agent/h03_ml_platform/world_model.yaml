        timeout: 10s
      image: nginx:1.25-alpine
      ports:
      - 80
      volumes: []
      zone: public_zone
    kind: web
    name: inference_api
    simulate:
      behaviors: []
      hostname: inference-api.production_ml_platform.internal
      issues: []
      role: Model inference REST API
      secrets:
      - model_api_key
      services: []
  kafka_broker:
    deploy:
      depends_on: []
      env: []
      healthcheck:
        interval: 30s
        retries: 3
        start_period: 30s
        test:
        - CMD-SHELL
        - nc -z localhost 9092 || (echo > /dev/tcp/localhost/9092) 2>/dev/null ||
          true
        timeout: 10s
      image: apache/kafka:3.7.0
      ports:
      - 9092
      volumes: []
      zone: data_zone
