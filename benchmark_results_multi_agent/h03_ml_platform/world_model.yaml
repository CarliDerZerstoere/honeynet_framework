systems:
  admin_panel:
    deploy:
      depends_on: []
      env: []
      healthcheck:
        interval: 30s
        retries: 3
        start_period: 30s
        test:
        - CMD-SHELL
        - curl -sf http://localhost:8080/ || wget -qO- http://localhost:8080/ || true
        timeout: 10s
      image: jenkins/jenkins:lts
      ports:
      - 8080
      - 50000
      volumes: []
      zone: public_zone
    kind: web
    name: admin_panel
    simulate:
      behaviors: []
      hostname: admin-panel.public.production_ml_platform.internal
      issues: []
      role: Administrative panel for system management
      secrets:
      - admin_panel_password
      services: []
  api_gateway:
    deploy:
      depends_on:
      - reverse_proxy
      env: []
      healthcheck:
        interval: 30s
        retries: 3
        start_period: 30s
        test:
        - CMD-SHELL
        - curl -sf http://localhost/ || wget -qO- http://localhost/ || true
        timeout: 10s
      image: nginx:1.25-alpine
      ports:
      - 80
      volumes: []
      zone: public_zone
    kind: web
    name: api_gateway
    simulate:
      behaviors: []
      hostname: api-gateway.public.production_ml_platform.internal
      issues: []
      role: API gateway for managing API requests
      secrets: []
      services: []
  backup_service:
    deploy:
      command:
      - minio
      - server
      - /data
      depends_on: []
      env:
      - MINIO_ACCESS_KEY=admin
      - MINIO_SECRET_KEY=admin123
      healthcheck:
        interval: 30s
        retries: 3
        start_period: 30s
        test:
        - CMD
        - curl
        - -f
        - http://localhost:9000/minio/health/live
        timeout: 10s
      image: minio/minio:latest
      ports:
      - 9000
      volumes: []
      zone: data_zone
    kind: storage
    name: backup_service
    simulate:
      behaviors: []
      hostname: backup-service.data.production_ml_platform.internal
      issues: []
      role: Backup service for data storage
      secrets:
      - backup_service_access_key
      services: []
  bait_feature_store_ui:
    deploy:
      depends_on: []
      env: []
      healthcheck:
        interval: 30s
        retries: 3
        start_period: 30s
        test:
        - CMD-SHELL
        - curl -sf http://localhost:3000/ || wget -qO- http://localhost:3000/ || true
        timeout: 10s
      image: grafana/grafana:10.2.0
      ports:
      - 3000
      volumes: []
      zone: public_zone
    kind: web
    name: bait_feature_store_ui
    simulate:
      behaviors: []
      hostname: bait-feature-store-ui.public.production_ml_platform.internal
      issues: []
      role: Decoy UI for feature store
      secrets: []
      services: []
  fake_data_service:
    deploy:
      command:
      - minio
      - server
      - /data
      depends_on: []
      env:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
      healthcheck:
        interval: 30s
        retries: 3
        start_period: 30s
        test:
        - CMD
        - wget
        - --spider
        - http://localhost:9000/minio/health/live
        timeout: 10s
      image: minio/minio:latest
      ports:
      - 9000
      volumes: []
      zone: internal_zone
    kind: storage
    name: fake_data_service
    simulate:
      behaviors: []
      hostname: fake-data-service.public.production_ml_platform.internal
      issues: []
      role: Fake data service for decoy purposes
      secrets: []
      services: []
  feature_store:
    deploy:
      command:
      - minio
      - server
      - /data
      depends_on: []
