      env:
      - MINIO_ACCESS_KEY=admin
      - MINIO_SECRET_KEY=admin123
      healthcheck:
        interval: 30s
        retries: 3
        start_period: 30s
        test:
        - CMD
        - curl
        - -f
        - http://localhost:9000/minio/health/live
        timeout: 10s
      image: minio/minio:latest
      ports:
      - 9000
      volumes: []
      zone: data_zone
    kind: storage
