zones:
  monitoring_zone:
    deploy:
      driver: bridge
      internal: true
      network_name: monitoring_zone
    name: monitoring_zone
  public_zone:
    deploy:
      driver: bridge
      internal: false
      network_name: public_zone
    name: public_zone
  trading_zone:
    deploy:
      driver: bridge
      internal: true
      network_name: trading_zone
    name: trading_zone
  vault_zone:
    deploy:
      driver: bridge
      internal: true
      network_name: vault_zone
    name: vault_zone
